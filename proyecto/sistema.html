
<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lyon Technologies — Sistema (Tema Naranja)</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Vista/css/estilo.css">
</head>

<body>
<nav class="navbar navbar-expand-lg">
    <a class="navbar-brand d-flex align-items-center gap-3" href="#">
        <div class="logoCircle">
            <img src="Vista/logo de empresa/logo.lyon-technologies.jpg" alt="Logo Lyon Technologies" class="logoImg">
        </div>
        <span class="brand-text">LYON <em>TECHNOLOGIES</em></span>
    </a>
</nav>

  <main class="container py-4">

    <!-- LOGIN / REGISTER -->
    <section id="homeView" class="card p-4 mx-auto" style="max-width:720px;">

      <h4 class="mb-4 fw-bold">Ingreso al Sistema</h4>

      <div class="btn-group w-100 mb-4" role="group">
        <button id="btnTabLogin" class="btn btn-primary active">
          Iniciar sesión
        </button>

        <button id="btnTabRegister" class="btn btn-outline-primary">
          Registrarse
        </button>
      </div>

      <!-- LOGIN -->
      <form id="formLogin" class="authForm text-start" novalidate>

        <div class="mb-3">
          <label class="form-label" for="loginEmail">
            Correo electrónico
          </label>

          <input id="loginEmail"
                 type="email"
                 class="form-control"
                 required
                 placeholder="ejemplo@correo.com">
        </div>

        <div class="mb-4">
          <label class="form-label" for="loginPass">
            Contraseña
          </label>

          <input id="loginPass"
                 type="password"
                 class="form-control"
                 required
                 minlength="4"
                 placeholder="Contraseña">
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Ingresar
        </button>

      </form>

      <!-- REGISTRO -->
      <form id="formRegister" class="authForm text-start" style="display:none;" novalidate>

        <!-- Nombre y Apellido -->
        <div class="row">

          <div class="col-md-6 mb-2">
            <label class="form-label" for="regName">
              Nombre
            </label>

            <input id="regName"
                   class="form-control"
                   required
                   pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+"
                   title="Solo letras y espacios"
                   placeholder="Tu nombre">
          </div>

          <div class="col-md-6 mb-2">
            <label class="form-label" for="regLastName">
              Apellido
            </label>

            <input id="regLastName"
                   class="form-control"
                   required
                   pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+"
                   title="Solo letras y espacios"
                   placeholder="Tu apellido">
          </div>

        </div>

        <!-- Tipo de documento -->
        <div class="mb-2">
          <label class="form-label" for="regDocumentType">
            Tipo de documento
          </label>

          <select id="regDocumentType"
                  class="form-select"
                  required>

            <option value="">Selecciona un tipo de documento</option>
            <option value="CC">Cédula de ciudadanía</option>
            <option value="TI">Tarjeta de identidad</option>
            <option value="CE">Cédula de extranjería</option>

          </select>
        </div>

        <!-- Número de documento -->
        <div class="mb-2">
          <label class="form-label" for="regDocument">
            Número de documento
          </label>

          <input id="regDocument"
                 class="form-control"
                 required
                 pattern="[0-9]+"
                 title="Solo números"
                 placeholder="Número de documento"
                 inputmode="numeric">
        </div>

        <!-- Dirección -->
        <div class="mb-2">
          <label class="form-label" for="regAddress">
            Dirección
          </label>

          <input id="regAddress"
                 type="text"
                 class="form-control"
                 required
                 placeholder="Ej: Calle 123 #45-67">
        </div>

        <!-- Correo -->
        <div class="mb-2">
          <label class="form-label" for="regEmail">
            Correo
          </label>

          <input id="regEmail"
                 type="email"
                 class="form-control"
                 required
                 placeholder="ejemplo@correo.com">
        </div>

        <!-- Teléfono -->
        <div class="mb-2">
          <label class="form-label" for="regPhone">
            Teléfono
          </label>

          <input id="regPhone"
                 class="form-control"
                 required
                 minlength="7"
                 maxlength="15"
                 pattern="[0-9]+"
                 title="Solo números"
                 placeholder="Ej: 3101234567"
                 inputmode="numeric">
        </div>

        <!-- Contraseña -->
        <div class="mb-2">
          <label class="form-label" for="regPass">
            Contraseña
          </label>

          <input id="regPass"
                 type="password"
                 class="form-control"
                 required
                 minlength="6"
                 placeholder="mínimo 6 caracteres">
        </div>

        <!-- Rol -->
        <div class="mb-3">
          <label class="form-label" for="regRole">
            Rol
          </label>

          <select id="regRole"
                  class="form-select"
                  required>

            <option value="">Selecciona un rol</option>
            <option>Cliente</option>
            <option>Empleado</option>
            <option>Logística</option>
            <option>Administrador</option>

          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Crear cuenta y acceder
        </button>

      </form>

    </section>

    <!-- DASHBOARD -->
    <section id="dashboard" class="mt-4" style="display:none;">

      <div class="d-flex justify-content-between align-items-center mb-3">

        <h3 id="dashWelcome" class="fw-bold mb-0">
          Panel
        </h3>

        <div>
          <button id="btnLogout" class="btn btn-outline-danger me-2">
            Cerrar sesión
          </button>

          <button id="btnProfile" class="btn btn-outline-secondary">
            Mi perfil
          </button>
        </div>

      </div>

      <div class="row">

        <aside class="col-md-3 mb-3">

          <div class="card p-3 mb-3">
            <h6 class="mb-2 fw-bold">Módulos</h6>
            <div id="moduleList" class="list-group list-group-flush"></div>
          </div>

          <div class="card p-3 mt-3" id="activityCard" style="display:none;">
            <h6 class="fw-bold">Actividad</h6>

            <div id="activityList"
                 class="small text-muted"
                 style="max-height:220px; overflow:auto;">
            </div>
          </div>

        </aside>

        <div class="col-md-9">

          <div id="contentArea">

            <div class="card p-4">
              <h5 class="fw-bold mb-2">
                Panel principal
              </h5>

              <p class="mb-0">
                Selecciona un módulo para comenzar.
              </p>
            </div>

          </div>

        </div>

      </div>

    </section>

  </main>

  <footer class="site-footer container mt-4">

    <div class="row justify-content-center">

      <div class="col-md-8 text-center py-3">

        <p class="mb-0">
          Contacto • Calle 123 #45-67, Bogotá D.C. •
          info@lyontechnologies.com
        </p>

      </div>

    </div>

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- MVC simple: Modelo -> Vista -> Controlador -->
  <script src="Modelo/modelo.js"></script>
  <script src="Vista/vista.js"></script>
  <script src="Controlador/controlador.js"></script>

</body>
</html>
